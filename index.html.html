<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title></title>
<style>
  * { box-sizing: border-box; }
  :root { color-scheme: light; }
  body {
    margin: 0; min-height: 100svh; background: #fff; color: #171717;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main {
    min-height: 100svh; width: min(100%, 430px); margin: auto;
    padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; align-items: center;
  }
  .home {
    flex: 1; width: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 36px;
  }
  .gym-button {
    width: 156px; height: 156px; border: 0; border-radius: 50%;
    background: #f5f5f5; display: grid; place-items: center; position: relative;
    box-shadow: 0 8px 28px rgba(0,0,0,.055);
    cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    animation: float 3s ease-in-out infinite;
    transition: background .2s ease, transform .18s ease, box-shadow .2s ease;
  }
  .gym-button:active { transform: scale(.93); }
  .gym-button.done { background: #e1f5e8; box-shadow: 0 8px 28px rgba(35,130,70,.10); animation: none; }
  .arm { font-family: "Apple Color Emoji", "Segoe UI Emoji", sans-serif; font-size: 70px; line-height: 1; }
  .tick {
    display: none; position: absolute; right: 3px; bottom: 3px; width: 37px; height: 37px;
    border-radius: 50%; background: #24934f; color: white; border: 3px solid white;
    font-size: 22px; font-weight: 600; align-items: center; justify-content: center;
  }
  .done .tick { display: flex; animation: pop .22s ease-out; }
  .calendar-button {
    border: 1px solid #e9e9e9; background: #fff; border-radius: 999px;
    padding: 13px 29px; color: #222; font-size: 15px; font-weight: 500;
    font-family: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .calendar-button:active { background: #f6f6f6; }
  .calendar-view { display: none; width: 100%; padding-top: 22px; }
  .calendar-view.visible { display: block; }
  .home.hidden { display: none; }
  .cal-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; }
  .back {
    background: none; border: 0; padding: 8px 8px 8px 0; font: inherit; font-size: 15px; color: #555; cursor: pointer;
  }
  .month-controls { display: flex; align-items: center; gap: 15px; }
  .month-name { min-width: 128px; text-align: center; font-size: 16px; font-weight: 600; text-transform: capitalize; }
  .month-arrow { background: none; border: 0; padding: 4px; color: #444; font-size: 24px; cursor: pointer; }
  .weekdays, .days { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; }
  .weekdays { margin-bottom: 10px; }
  .weekdays div { color: #999; font-size: 12px; padding: 8px 0; }
  .day {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    position: relative; font-size: 14px; color: #262626;
  }
  .day span {
    width: 36px; height: 36px; border-radius: 50%; display: flex;
    align-items: center; justify-content: center;
  }
  .day.outside { color: #c9c9c9; }
  .day.today span { outline: 1px solid #d0d0d0; outline-offset: -1px; }
  .day.trained span { background: #e1f5e8; color: #16733a; font-weight: 650; }
  .day.trained span::after { content: "✓"; font-size: 11px; position: absolute; right: 4px; bottom: 2px; color: #16733a; }
  .note { margin-top: 22px; color: #999; font-size: 12px; text-align: center; }
  @keyframes float { 0%,100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-5px) rotate(1deg); } }
  @keyframes pop { from { transform: scale(.65); } to { transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { .gym-button { animation: none; } * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <section class="home" id="home">
    <button class="gym-button" id="gymButton" aria-label="Marcar gimnasio de hoy" aria-pressed="false">
      <span class="arm" aria-hidden="true">💪</span>
      <span class="tick" aria-hidden="true">✓</span>
    </button>
    <button class="calendar-button" id="openCalendar">Calendario</button>
  </section>

  <section class="calendar-view" id="calendarView" aria-label="Calendario de gimnasio">
    <div class="cal-top">
      <button class="back" id="back">‹ Volver</button>
      <div class="month-controls">
        <button class="month-arrow" id="prev" aria-label="Mes anterior">‹</button>
        <div class="month-name" id="monthName"></div>
        <button class="month-arrow" id="next" aria-label="Mes siguiente">›</button>
      </div>
    </div>
    <div class="weekdays" aria-hidden="true">
      <div>L</div><div>M</div><div>X</div><div>J</div><div>V</div><div>S</div><div>D</div>
    </div>
    <div class="days" id="days"></div>
    <div class="note">Los días con un tic son días de gimnasio.</div>
  </section>
</main>
<script>
  const KEY = "gym-days-v2";
  const now = new Date();
  now.setHours(12,0,0,0);
  let month = new Date(now.getFullYear(), now.getMonth(), 1);
  let trained = [];
  try {
    const saved = JSON.parse(localStorage.getItem(KEY) || "[]");
    if (Array.isArray(saved)) trained = [...new Set(saved.filter(v => /^\d{4}-\d{2}-\d{2}$/.test(v)))];
  } catch (_) {}
  const keyOf = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  function renderButton() {
    const done = trained.includes(keyOf(now));
    document.getElementById("gymButton").classList.toggle("done", done);
    document.getElementById("gymButton").setAttribute("aria-pressed", String(done));
  }
  function renderCalendar() {
    document.getElementById("monthName").textContent = month.toLocaleDateString("es-ES", {month:"long", year:"numeric"});
    const grid = document.getElementById("days");
    grid.innerHTML = "";
    const first = new Date(month.getFullYear(), month.getMonth(), 1);
    const offset = (first.getDay()+6)%7;
    const start = new Date(first);
    start.setDate(first.getDate()-offset);
    for (let i=0; i<42; i++) {
      const d = new Date(start);
      d.setDate(start.getDate()+i);
      const key = keyOf(d);
      const cell = document.createElement("div");
      cell.className = "day";
      if (d.getMonth() !== month.getMonth()) cell.classList.add("outside");
      if (key === keyOf(now)) cell.classList.add("today");
      if (trained.includes(key)) cell.classList.add("trained");
      const number = document.createElement("span");
      number.textContent = d.getDate();
      cell.appendChild(number);
      grid.appendChild(cell);
    }
    document.getElementById("prev").disabled = month.getFullYear() === 2000 && month.getMonth() === 0;
    document.getElementById("next").disabled = month.getFullYear() === now.getFullYear() && month.getMonth() === now.getMonth();
    document.getElementById("prev").style.opacity = document.getElementById("prev").disabled ? ".25" : "1";
    document.getElementById("next").style.opacity = document.getElementById("next").disabled ? ".25" : "1";
  }
  document.getElementById("gymButton").addEventListener("click", () => {
    const key = keyOf(now);
    if (trained.includes(key)) trained = trained.filter(v => v !== key);
    else trained.push(key);
    localStorage.setItem(KEY, JSON.stringify(trained));
    renderButton();
  });
  document.getElementById("openCalendar").addEventListener("click", () => {
    document.getElementById("home").classList.add("hidden");
    document.getElementById("calendarView").classList.add("visible");
    renderCalendar();
  });
  document.getElementById("back").addEventListener("click", () => {
    document.getElementById("calendarView").classList.remove("visible");
    document.getElementById("home").classList.remove("hidden");
  });
  document.getElementById("prev").addEventListener("click", () => {
    month = new Date(month.getFullYear(), month.getMonth()-1, 1);
    renderCalendar();
  });
  document.getElementById("next").addEventListener("click", () => {
    if (month.getFullYear() === now.getFullYear() && month.getMonth() === now.getMonth()) return;
    month = new Date(month.getFullYear(), month.getMonth()+1, 1);
    renderCalendar();
  });
  renderButton();
</script>
</body>
</html>
