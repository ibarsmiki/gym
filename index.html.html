<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gym</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: white;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
}

.contenedor {
    width: 100%;
    max-width: 430px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.boton-gym {
    width: 155px;
    height: 155px;
    border: none;
    border-radius: 50%;
    background: #f5f5f5;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    position: relative;
    box-shadow: 0 8px 25px rgba(0,0,0,0.06);
    animation: flotar 3s ease-in-out infinite;
    transition: 0.2s;
}

.boton-gym:active {
    transform: scale(0.92);
}

.boton-gym.marcado {
    background: #e2f5e8;
    animation: none;
}

.emoji {
    font-family: "Apple Color Emoji";
    font-size: 70px;
}

.tick {
    position: absolute;
    right: 3px;
    bottom: 3px;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #24a148;
    color: white;
    border: 3px solid white;
    display: none;
    justify-content: center;
    align-items: center;
    font-size: 22px;
    font-weight: bold;
}

.marcado .tick {
    display: flex;
}

.calendario-boton {
    margin-top: 35px;
    padding: 13px 28px;
    border-radius: 30px;
    border: 1px solid #e8e8e8;
    background: white;
    font-size: 15px;
    color: #222;
    cursor: pointer;
}

.calendario-boton:active {
    background: #f5f5f5;
}

.calendario {
    display: none;
    width: 90%;
    max-width: 400px;
    padding-top: 30px;
}

.calendario.visible {
    display: block;
}

.volver {
    border: none;
    background: none;
    font-size: 15px;
    color: #555;
    cursor: pointer;
    margin-bottom: 25px;
}

.mes {
    text-align: center;
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 25px;
}

.dias-semana,
.dias {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
}

.dias-semana div {
    color: #999;
    font-size: 12px;
    padding-bottom: 12px;
}

.dia {
    height: 48px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.dia span {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
}

.dia.entrenado span {
    background: #e2f5e8;
    color: #17833f;
    font-weight: bold;
}

.dia.entrenado span::after {
    content: "✓";
    font-size: 10px;
    position: absolute;
    margin-left: 22px;
    margin-top: 22px;
}

@keyframes flotar {
    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-5px);
    }
}
</style>
</head>

<body>

<div class="contenedor">

    <div id="inicio">

        <button class="boton-gym" id="botonGym">
            <span class="emoji">💪</span>
            <span class="tick">✓</span>
        </button>

        <button class="calendario-boton" id="abrirCalendario">
            Calendario
        </button>

    </div>


    <div class="calendario" id="calendario">

        <button class="volver" id="volver">
            ‹ Volver
        </button>

        <div class="mes" id="nombreMes"></div>

        <div class="dias-semana">
            <div>L</div>
            <div>M</div>
            <div>X</div>
            <div>J</div>
            <div>V</div>
            <div>S</div>
            <div>D</div>
        </div>

        <div class="dias" id="dias"></div>

    </div>

</div>


<script>

const boton = document.getElementById("botonGym");
const calendario = document.getElementById("calendario");
const inicio = document.getElementById("inicio");

const hoy = new Date();

function obtenerClave(fecha) {
    return fecha.getFullYear() + "-" +
        String(fecha.getMonth() + 1).padStart(2, "0") + "-" +
        String(fecha.getDate()).padStart(2, "0");
}

let entrenamientos =
    JSON.parse(localStorage.getItem("entrenamientos")) || [];


function actualizarBoton() {

    const claveHoy = obtenerClave(hoy);

    if (entrenamientos.includes(claveHoy)) {
        boton.classList.add("marcado");
    } else {
        boton.classList.remove("marcado");
    }
}


boton.addEventListener("click", function() {

    const claveHoy = obtenerClave(hoy);

    if (entrenamientos.includes(claveHoy)) {

        entrenamientos =
            entrenamientos.filter(dia => dia !== claveHoy);

    } else {

        entrenamientos.push(claveHoy);

    }

    localStorage.setItem(
        "entrenamientos",
        JSON.stringify(entrenamientos)
    );

    actualizarBoton();

});


document.getElementById("abrirCalendario")
.addEventListener("click", function() {

    inicio.style.display = "none";
    calendario.classList.add("visible");

    crearCalendario();

});


document.getElementById("volver")
.addEventListener("click", function() {

    calendario.classList.remove("visible");
    inicio.style.display = "flex";
    inicio.style.flexDirection = "column";
    inicio.style.alignItems = "center";

});


function crearCalendario() {

    const nombreMes =
        document.getElementById("nombreMes");

    const dias =
        document.getElementById("dias");

    const año = hoy.getFullYear();
    const mes = hoy.getMonth();

    nombreMes.textContent =
        hoy.toLocaleDateString("es-ES", {
            month: "long",
            year: "numeric"
        });

    dias.innerHTML = "";

    const primerDia =
        new Date(año, mes, 1);

    const ultimoDia =
        new Date(año, mes + 1, 0);

    let inicioSemana =
        (primerDia.getDay() + 6) % 7;

    for (let i = 0; i < inicioSemana; i++) {

        const hueco = document.createElement("div");

        dias.appendChild(hueco);

    }

    for (
        let dia = 1;
        dia <= ultimoDia.getDate();
        dia++
    ) {

        const fecha =
            new Date(año, mes, dia);

        const elemento =
            document.createElement("div");

        elemento.className = "dia";

        const numero =
            document.createElement("span");

        numero.textContent = dia;

        elemento.appendChild(numero);

        if (
            entrenamientos.includes(
                obtenerClave(fecha)
            )
        ) {

            elemento.classList.add("entrenado");

        }

        dias.appendChild(elemento);

    }

}


actualizarBoton();

</script>

</body>
</html>
